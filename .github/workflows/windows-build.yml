name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2 and NSIS prerequisites
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Install JavaScript dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm install --registry=https://registry.npmjs.org/ --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-timeout=300000
      - name: Run UI tests
        run: |
          npx playwright install chromium
          npm run test:unit
          npm test
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri -- build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SYNAPS-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
