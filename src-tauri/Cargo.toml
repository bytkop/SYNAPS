[package]
name = "synaps"
version = "0.4.0"
description = "SYNAPS local-first AI architecture studio"
authors = ["SYNAPS contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.2" }

[dependencies]
tauri = { version = "=2.12.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "=1.54.1", features = ["macros", "time"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
